name: 构建并推送镜像

# 推 main 就出一版 latest；打 v* 标签则同时出带版本号的镜像。
# 镜像推到 GHCR（ghcr.io/<你的用户名>/skullking-server 和 -client），
# GHCR 对公开镜像免费，Portainer 拉取时也不需要配凭据。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: deploy/Dockerfile.server
          - name: client
            dockerfile: deploy/Dockerfile.client

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 只接受全小写的镜像名，而 GitHub 用户名可能带大写。
      - name: 规范化镜像归属
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/skullking-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 把构建缓存也存在 GHCR 里，下次只重建改动的层。
          cache-from: type=gha
          cache-to: type=gha,mode=max
