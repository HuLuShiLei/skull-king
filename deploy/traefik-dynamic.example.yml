# 将本文件放到 Traefik 的 file provider 目录（如 /etc/traefik/conf 或 /etc/traefik/dynamic）。
# 静态配置需包含：
#   providers:
#     file:
#       directory: /etc/traefik/conf
#       watch: true
#
# 替换：域名、上游内网 IP、SERVER_PORT / WEB_PORT、HTTPS entryPoint 名称。

http:
  routers:
    # priority 必须高于 skullking-web，否则仅 Host 的规则会匹配 /api 与 /hub。
    skullking-api:
      rule: "Host(`sk.example.com`) && (PathPrefix(`/api`) || PathPrefix(`/hub`))"
      priority: 10
      entryPoints:
        - websecure
      service: skullking-api
      # 已配置 tls.stores.default 时使用空对象；否则改为 certResolver。
      tls: {}

    skullking-web:
      rule: "Host(`sk.example.com`)"
      priority: 1
      entryPoints:
        - websecure
      service: skullking-web
      tls: {}

  services:
    skullking-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://192.168.66.20:8080"

    skullking-web:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://192.168.66.20:8081"
