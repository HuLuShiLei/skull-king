# Traefik 跑在另一台机器上时，把这个文件放进它的 file provider 目录
# （常见是 /etc/traefik/conf 或 /etc/traefik/dynamic），文件名随意。
# Traefik 开了 watch: true 的话会热加载，不用重启。
#
# 前提是静态配置里启用了 file provider：
#   providers:
#     file:
#       directory: /etc/traefik/conf
#       watch: true
#
# 需要按实际情况替换的地方：
#   sk.example.com   → 你的域名
#   192.168.66.20    → 跑容器那台机器的内网 IP
#   8080 / 8081      → stack 里 SERVER_PORT / WEB_PORT 实际发布的端口
#   websecure        → 你 Traefik 里 HTTPS entryPoint 的名字

http:
  routers:
    # 这条的 priority 必须比 skullking-web 高，否则只有 Host 条件的那条
    # 会把 /api 和 /hub 一起吃掉，前端就把 API 请求当路由渲染成首页了。
    skullking-api:
      rule: "Host(`sk.example.com`) && (PathPrefix(`/api`) || PathPrefix(`/hub`))"
      priority: 10
      entryPoints:
        - websecure
      service: skullking-api
      # 已经配了泛域名默认证书（tls.stores.default）的话，空对象就够了。
      # 没有的话改成 tls: { certResolver: 你的解析器名 }。
      tls: {}

    skullking-web:
      rule: "Host(`sk.example.com`)"
      priority: 1
      entryPoints:
        - websecure
      service: skullking-web
      tls: {}

  services:
    skullking-api:
      loadBalancer:
        # 让后端能从 X-Forwarded-* 里读到真实 Host 和访客 IP。
        passHostHeader: true
        servers:
          - url: "http://192.168.66.20:8080"

    skullking-web:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://192.168.66.20:8081"

# 两点提醒：
#
# 1. 别给这两个 router 挂 ipAllowList 之类的内网白名单中间件——
#    这游戏就是给同事在公司网络里开的，挂了就只有你自己能进。
#
# 2. SignalR 的 WebSocket 不需要额外配置，Traefik 会自动转发 Upgrade 头。
#    但如果你挂了会改写请求头的中间件，注意别把 Connection 和 Upgrade 洗掉，
#    否则表现是连接反复重连、出牌要等很久才同步。
