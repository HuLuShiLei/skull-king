server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 反代已经在外层做了压缩也不冲突，这里开着能让直连场景也受益。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 别把自己的版本号告诉别人。
    server_tokens off;

    # 带哈希的产物可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    # index.html 绝不能缓存：里面有启动时注入的后端地址，
    # 缓存住会导致换了后端地址的用户还连旧的。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 前端自己管路由，/j/xxx 和 /r/xxx 这些都得回到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
