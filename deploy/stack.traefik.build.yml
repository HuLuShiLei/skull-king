# 与 stack.traefik.yml 等价，镜像在本机构建，不拉取 GHCR。
# Portainer：Stacks → Add stack → Repository，Compose path 为本文件。
# build context 相对本文件所在目录，故为上级仓库根。

services:
  server:
    build:
      # context 相对 compose 文件目录；本文件在 deploy/，仓库根为 ..
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: skullking-server:selfbuilt
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/skullking.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - skullking-data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}

      - traefik.http.routers.skullking-api.rule=Host(`${SKULLKING_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/hub`))
      - traefik.http.routers.skullking-api.priority=100
      - traefik.http.routers.skullking-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skullking-api.tls=true
      - traefik.http.routers.skullking-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.skullking-api.service=skullking-api

      - traefik.http.services.skullking-api.loadbalancer.server.port=8080
      - traefik.http.services.skullking-api.loadbalancer.passhostheader=true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: skullking-client:selfbuilt
    restart: unless-stopped
    environment:
      SKULLKING_API_BASE: ${SKULLKING_API_BASE:-}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}

      - traefik.http.routers.skullking-web.rule=Host(`${SKULLKING_DOMAIN}`)
      - traefik.http.routers.skullking-web.priority=1
      - traefik.http.routers.skullking-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skullking-web.tls=true
      - traefik.http.routers.skullking-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.skullking-web.service=skullking-web

      - traefik.http.services.skullking-web.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  skullking-data:
