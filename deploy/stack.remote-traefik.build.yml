# 与 stack.remote-traefik.yml 等价，镜像在本机构建。
# Portainer Repository 的 Compose path 为本文件。
# build context 相对本文件所在目录，故为上级仓库根。

services:
  server:
    build:
      # context 相对 compose 文件目录；本文件在 deploy/，仓库根为 ..
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: skullking-server:selfbuilt
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/skullking.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - skullking-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-8080}:8080"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: skullking-client:selfbuilt
    restart: unless-stopped
    environment:
      SKULLKING_API_BASE: ${SKULLKING_API_BASE:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  skullking-data:
