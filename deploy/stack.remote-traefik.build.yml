# 和 stack.remote-traefik.yml 等价，区别只有镜像在本机现场构建、不从仓库拉。
# 适合 GHCR 还没跑通（比如 Actions 被账单锁住）的时候先把服务跑起来。
#
# 用法：Portainer → Stacks → Add stack → Repository，
# Compose path 填 deploy/stack.remote-traefik.build.yml。

services:
  server:
    build:
      # context 是相对「compose 文件所在目录」解析的，这个文件在 deploy/ 下，
      # 所以要往上一级才是仓库根——Dockerfile 里 COPY 的都是 src/ 这种根路径。
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: skullking-server:selfbuilt
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/skullking.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - skullking-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-8080}:8080"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: skullking-client:selfbuilt
    restart: unless-stopped
    environment:
      SKULLKING_API_BASE: ${SKULLKING_API_BASE:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  skullking-data:
