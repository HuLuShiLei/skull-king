# Traefik 在其他主机时使用。无 traefik.* 标签、不加入 Traefik 网络。
# 将端口发布到本机，由 Traefik 主机的 file provider 指向上游。
# 示例：traefik-dynamic.example.yml。路由仍为同源，无需 CORS。

services:
  server:
    image: ghcr.io/${IMAGE_OWNER}/skullking-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/skullking.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - skullking-data:/data
    ports:
      # BIND_ADDR 应为本机内网 IP，避免在全部网卡上监听。
      - "${BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-8080}:8080"

  web:
    image: ghcr.io/${IMAGE_OWNER}/skullking-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # 同源留空。由 Traefik 按路径分流。
      SKULLKING_API_BASE: ${SKULLKING_API_BASE:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  skullking-data:
