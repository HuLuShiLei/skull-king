# 本地自测用：两个容器直接映射端口，不经反代。
#   docker compose up -d --build   然后打开 http://localhost:8081
#
# 这里刻意用「前后端不同端口」的跨域模式，顺便把 CORS 和运行时注入这两条链路
# 一起验证掉。生产环境推荐同源模式（见 deploy/stack.traefik.yml），不需要 CORS。

services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: skullking-server:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/skullking.db
      Cors__AllowedOrigins: http://localhost:8081
    volumes:
      - skullking-data:/data

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    image: skullking-client:local
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      SKULLKING_API_BASE: http://localhost:8080
    depends_on:
      server:
        condition: service_healthy

volumes:
  skullking-data:
