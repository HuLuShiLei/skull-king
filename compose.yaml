# 本地验证：构建镜像并映射端口，不经过反向代理。
#   docker compose up -d --build
# 前端 http://localhost:8081 ，后端 http://localhost:8080
#
# 此处使用跨端口访问以覆盖 CORS 与运行时注入。生产环境应使用同源反代
# （deploy/stack.traefik.yml），无需 CORS。

services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: skullking-server:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/skullking.db
      Cors__AllowedOrigins: http://localhost:8081
    volumes:
      - skullking-data:/data

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    image: skullking-client:local
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      SKULLKING_API_BASE: http://localhost:8080
    depends_on:
      server:
        condition: service_healthy

volumes:
  skullking-data:
